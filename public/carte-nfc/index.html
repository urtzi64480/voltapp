<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benoit Resche - Voltapp</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #f1f5f9;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 400px;
    width: 100%;
    background: #1e293b;
    border-radius: 20px;
    padding: 32px 24px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    text-align: center;
  }
  .logo {
    width: 120px;
    height: auto;
    margin: 0 auto 20px;
    display: block;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .role { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
  .info-list { text-align: left; margin-bottom: 28px; }
  .info-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid #334155;
    font-size: 15px;
  }
  .info-item:last-child { border-bottom: none; }
  .info-item a { color: #f1f5f9; text-decoration: none; word-break: break-all; }
  .icon {
    width: 20px; height: 20px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: #fbbf24;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 12px;
    transition: opacity 0.2s;
  }
  .btn:active { opacity: 0.8; }
  .btn-primary {
    background: #fbbf24;
    color: #0f172a;
  }
  .btn-secondary {
    background: transparent;
    color: #f1f5f9;
    border: 1px solid #475569;
  }
</style>
</head>
<body>
  <div class="card">
    <img src="logo.png" alt="Logo" class="logo">
    <h1>Benoit Resche</h1>
    <div class="role">Voltapp</div>

    <div class="info-list">
      <div class="info-item">
        <span class="icon">📞</span>
        <a href="tel:0769995222">07 69 99 52 22</a>
      </div>
      <div class="info-item">
        <span class="icon">✉️</span>
        <a href="mailto:wattelse.elec@proton.me">wattelse.elec@proton.me</a>
      </div>
    </div>

    <a class="btn btn-primary" href="contact.vcf" download="Benoit-Resche-Voltapp.vcf">
      + Ajouter à mes contacts
    </a>
    <a class="btn btn-secondary" href="https://voltapp-ten.vercel.app/demande/d506c94e-40c7-4bcd-a48c-97e86f4ea7c0">
      Demander un devis
    </a>
  </div>
</body>
</html>
